aid: wisdom-ai
name: Wisdom AI
description: >-
  WisdomAI is an enterprise agentic analytics platform built around an Adaptive
  Context Engine that governs business context across distributed data sources
  (Snowflake, BigQuery, Databricks, Redshift, SharePoint, and more). It powers
  conversational business intelligence, AI-powered dashboards, and analytics
  agents that the company reports deliver 95%+ answer accuracy in production.
  For developers, WisdomAI exposes a GraphQL API (queries, mutations, and
  WebSocket subscriptions), a React and Node embedding SDK (@wisdomai/react,
  @wisdomai/node), and a remote Model Context Protocol (MCP) server, all
  governed by row-level and column-level security, SSO, and SCIM/JIT
  provisioning so teams can build custom and embedded analytics experiences.
