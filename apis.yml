apis:
- name: WisdomAI GraphQL API
  description: >-
    Single GraphQL endpoint for programmatic access to WisdomAI domains, tables,
    users, dashboards, and analytics data. Supports queries, mutations, and
    real-time WebSocket subscriptions. Tenant-scoped: replace {ACCOUNT} with
    your WisdomAI tenant (both askwisdom.ai and wisdom.ai are valid depending on
    deployment). Authenticate with a JWT session token obtained by exchanging an
    API access key via the exchangeAccessToken query (Descope).
  humanURL: https://docs.wisdom.ai/integrations/graphql-api/GraphQL-API
  baseURL: https://{ACCOUNT}.askwisdom.ai/graphql
